# Standalone debugging only. Stop this before ASS takes ownership of the GPU.
services:
  aligner:
    build: .
    image: ghcr.io/stevelittlefish/forced-aligner:latest
    ports:
      - "8830:8830"
    volumes:
      - /srv/ass/cache:/cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
