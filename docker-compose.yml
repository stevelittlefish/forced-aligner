# One-command run of the aligner on the AI server. Equivalent to the `docker run`
# in docs/deploy.md, but the GPU reservation, volume wiring, and port live here.
#
#   docker compose up -d --build      # start
#   docker compose logs -f            # first /align downloads the model (slow)
#   docker compose down               # stop
#
# Needs the NVIDIA Container Toolkit on the host (same requirement as `--gpus all`).

services:
  aligner:
    build: .
    image: forced-aligner
    ports:
      - "8830:8830"
    volumes:
      # Host state lives under /srv/forced-aligner (create it before first run:
      # `sudo mkdir -p /srv/forced-aligner/models` and drop config.toml there).
      #
      # config.toml is the ONLY configuration source (no env vars). Keep
      # [server].port = 8830 in it so it matches the published port above.
      - /srv/forced-aligner/config.toml:/app/config.toml:ro
      # Persist the Hugging Face model cache so each language downloads once.
      # Point [align].model_cache_dir at /models in config.toml to use it.
      - /srv/forced-aligner/models:/models
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            # Pin to GPU 0 specifically (device_ids, not count) so this service
            # always lands on the same card and doesn't contend with the others.
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
