# forced-aligner configuration. Copy to config.toml and edit.
# No environment variables — this file is the only configuration source.

[server]
host = "0.0.0.0"
port = 8830

# Optional bearer token. Empty means no auth (the LAN default, like Demucs).
# If set, requests must send `Authorization: Bearer <token>`.
auth_token = ""

[align]
# "cuda" on the AI server, "cpu" for smoke tests on a laptop.
device = "cuda"

# wav2vec2 compute type: "float16" on GPU, "int8" or "float32" on CPU.
compute_type = "float16"

# Language used when a request omits `language`. This service cannot detect
# language from audio alone (that needs transcription), so the caller should
# normally send it; this is only the fallback.
default_language = "en"

# WhisperX model downloads live under this service's private cache directory.
# Mount /srv/ass/cache:/cache. HF/torch caches are also set in the image.
model_cache_dir = "/cache/aligner/models"

# Trim silence/instrumental lead-in before aligning. Almost always wanted.
vad_trim = true

# Preload English before readiness. Only ONE language model stays resident;
# requesting another unloads the previous one. Use [] for lazy loading. A preload
# failure fails startup, so ASS will not send jobs to a broken backend.
preload_languages = ["en"]

[jobs]
# ASS harvests results before eviction. No output mount is needed: this scratch
# directory disappears when ASS removes the container. No automatic expiry can
# race ASS's artifact download. For standalone use, clean it after consumption.
directory = "/app/outputs"
max_pending_jobs = 8  # running + queued + uploads being accepted
max_upload_mb = 512  # copied in chunks; rejects larger files with HTTP 413
